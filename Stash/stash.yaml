# ---------------- 规则 ----------------
rules:
  # 内网 IP 最先直连（Tailscale 的端口映射、访问路由器等不会被送进代理）
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,custom_direct_ip,DIRECT,no-resolve

  # 国外 QUIC 拒绝，让浏览器回落到 TCP
  - AND,((NETWORK,udp),(DST-PORT,443),(RULE-SET,geolocation_not_cn)),REJECT,no-track
  # NTP 时间校准直连
  - AND,((NETWORK,udp),(DST-PORT,123)),DIRECT

  # Tailscale：UDP 打洞直连，TCP（控制面、DERP、测速）走代理
  # 三个进程名分别对应：Homebrew 版 / App Store 版 / 官网独立版
  - AND,((OR,((PROCESS-NAME,tailscaled),(PROCESS-NAME,IPNExtension),(PROCESS-NAME,io.tailscale.ipn.macsys.network-extension))),(NETWORK,udp)),DIRECT
  - PROCESS-NAME,tailscaled,🚀 节点选择
  - PROCESS-NAME,IPNExtension,🚀 节点选择
  - PROCESS-NAME,io.tailscale.ipn.macsys.network-extension,🚀 节点选择
  # RustDesk：UDP 打洞直连
  - AND,((PROCESS-NAME,RustDesk),(NETWORK,udp)),DIRECT

  - RULE-SET,custom_reject,REJECT
  - RULE-SET,ads,🛑 广告拦截
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,custom_direct,DIRECT

  # 国内直连
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,speedtest,DIRECT
  - RULE-SET,apple_cn,DIRECT
  - RULE-SET,google_cn,DIRECT
  - RULE-SET,aws_cn,DIRECT
  - RULE-SET,cloudflare_cn,DIRECT
  - RULE-SET,games_cn,DIRECT

  # BT 客户端直连
  - PROCESS-NAME,qbittorrent,DIRECT
  - PROCESS-NAME,Transmission,DIRECT
  - PROCESS-NAME,transmission-daemon,DIRECT

  # AI 服务
  - RULE-SET,openai,🤖 AI 服务
  - RULE-SET,anthropic,🤖 AI 服务
  - RULE-SET,gemini,🤖 AI 服务
  - RULE-SET,perplexity,🤖 AI 服务

  # 国外
  - RULE-SET,custom_proxy,🚀 节点选择
  - RULE-SET,geolocation_not_cn,🚀 节点选择

  # IP 规则（放在所有域名规则之后）
  - RULE-SET,custom_proxy_ip,🚀 节点选择,no-resolve
  - RULE-SET,telegram_ip,🚀 节点选择,no-resolve
  - RULE-SET,google_ip,🚀 节点选择,no-resolve
  - RULE-SET,twitter_ip,🚀 节点选择,no-resolve
  - RULE-SET,cn_ip,DIRECT

  - MATCH,🐟 漏网之鱼
