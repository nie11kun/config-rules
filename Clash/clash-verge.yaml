# =====================================================================
#  Clash Verge Rev（mihomo 内核）配置
#  TUN 相关设置（堆栈、排除网段等）由 Verge 界面管理，不写在这里：
#    设置 → 虚拟网卡模式 → 齿轮 → 堆栈选 Mixed
# =====================================================================

# ---------------- 基础设置 ----------------
mixed-port: 7897
allow-lan: false # 以 Verge「局域网连接」开关为准
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict # 按进程名分流需要

profile:
  store-selected: true
  store-fake-ip: true

# ---------------- 静态 hosts ----------------
# 如果节点 server 填的是域名（如 360.com）且需要固定 IP，在这里加映射：
hosts:
  "360.com": 1.2.3.4

# ---------------- 流量嗅探 ----------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"
    - "Mijia Cloud"

# ---------------- DNS ----------------
dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain"
    - "+.home.marco"
    - "+.ts.net"
    - "+.niekun.net"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"

  respect-rules: true # DNS 查询也遵循分流规则，国外 DoH 走代理
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver: # 直连流量用国内 DNS，拿国内 CDN 最优 IP
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "+.home.marco,+.ts.net": system # 局域网 / Tailscale 域名交给系统 DNS
    "rule-set:private_domain,cn_domain,apple_cn,google_cn,aws_cn,cloudflare_cn,games_cn,speedtest":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

# ---------------- 代理节点 ----------------
proxies:
  - name: out-vmess
    type: vmess
    server: 111.111.111.111 # ← 你的服务器地址
    port: 443
    uuid: uuid-uuid-uuid-uuid # ← 你的 UUID
    alterId: 0
    cipher: auto
    udp: true
    tfo: false # Windows 上 TFO 兼容性差，保持关闭
    tls: true
    servername: xxx.com
    alpn: [http/1.1] # WebSocket 需要 HTTP/1.1
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /path # ← 你的 WebSocket 路径
      headers:
        Host: xxx.com

# ---------------- 策略组 ----------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [out-vmess, DIRECT]

  - name: 🤖 AI 服务
    type: select
    proxies: [🚀 节点选择, out-vmess, DIRECT]

  - name: 🛑 广告拦截
    type: select
    proxies: [DIRECT, REJECT]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, DIRECT]

# ---------------- 规则集 ----------------
rule-anchor:
  domain:
    &domain {
      type: http,
      interval: 86400,
      behavior: domain,
      format: mrs,
      proxy: 🚀 节点选择,
    }
  ipcidr:
    &ipcidr {
      type: http,
      interval: 86400,
      behavior: ipcidr,
      format: mrs,
      proxy: 🚀 节点选择,
    }

rule-providers:
  # —— 自定义内联列表 ——
  custom_reject:
    type: inline
    behavior: domain
    payload:
      - "+.360.com"
      - "+.360.cn"
      - "+.datadoghq.com"
  custom_direct:
    type: inline
    behavior: domain
    payload:
      - "+.ts.net"
      - "+.home.marco"
      - "+.niekun.net"
      - "+.240128.xyz"
      - "+.pages.dev"
      - "+.msftncsi.com"
      - "+.msftconnecttest.com"
      - "+.push.apple.com" # 苹果推送长连接，直连更稳定
  custom_proxy:
    type: inline
    behavior: domain
    payload:
      - "+.tailscale.com"
      - "+.testflight.apple.com"
      - "+.jsdelivr.net"
  custom_proxy_ip:
    type: inline
    behavior: ipcidr
    payload:
      - 1.1.1.1/32
      - 8.8.8.8/32
  custom_direct_ip:
    type: inline
    behavior: ipcidr
    payload:
      - 27.168.0.0/16

